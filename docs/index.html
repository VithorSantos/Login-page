<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <section class="Texto">
            <div class="Login">
                <h1 class="Login__titulo">Welcome Back 👋</h1>
                <p class="Login__paragrafo">Today is a new day. It's you day. You shape it.</p>
                <p class="Login__paragrafo2">Sign in to start managing your projects</p>
                <h2 class="Login__titulo__inputemail">Email</h2>
                <input class="Login__input__email" type="email" placeholder="Example@email.com"/>
                <h2 class="Login__titulo__inputsenha">Password</h2>
                <input class="Login__input__senha" type="password" placeholder="At least 8 characters"/>
                <a class="Login__recuperacao">Forgot Password?</a>
                <button class="Login__botao__login">Sign in</button>
            </div>
            <div class="separador">
                <div class="separador__linha"></div>
                <span class="separador__texto">Or</span>
                <div class="separador__linha"></div>
            </div>
            <div class="LoginAT">
                <button class="LoginAT__Google"><img src="./assets/Google.png" alt="Logo do Google">Sign in with Google</button>
                <button class="LoginAT__Facebook"><img src="./assets/Facebook.png" alt="Logo do Google">Sign in with Facebook</button>
                <p class="LoginAT__texto">Don't you have an account? <a class="LoginAT__link">Sign up</a></p>
            </div>
        </section>
        <section class="Imagem__Login">
            <img class="Imagem__Login__img" src="./assets/Login Art.png" alt="Arte de da pagina com um vaso de flores">;
        </section>
    </main>
</body>

</html>
